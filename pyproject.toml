[project]
name = "customer-shop-assistant"
version = "0.1.0"
description = "Research demo chatbot for clothing customer shop assistant"
readme = "README.md"
authors = [
    { name = "Ngô Quang Trường", email = "nqt26304@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
customer-shop-assistant = "customer_shop_assistant:main"
assistant-cli = "customer_shop_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
